services:
  postgres:
    image: postgres:18-alpine
    container_name: despliegue-postgres
    environment:
      POSTGRES_DB: despliegue_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build:
      context: ./api
    container_name: despliegue-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: despliegue_db
      DB_USER: app_user
      DB_PASSWORD: app_password
    depends_on:
      - postgres

  nginx:
    image: nginx:1.30-alpine
    container_name: despliegue-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data: